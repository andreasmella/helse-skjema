<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Helseopplysninger — generer DOCX</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <h1>Helseopplysninger — generer DOCX</h1>

    <p>Velg JSON-filen med skjema-data (store filer støttes). Valgfritt: last opp en logo PNG for å bruke i dokumentet.</p>

    <form id="uploadForm">
      <label class="file">
        JSON-fil (obligatorisk)
        <input type="file" name="json" id="jsonInput" accept="application/json" required>
      </label>
      <label class="file">
        Logo (valgfritt)
        <input type="file" name="logo" id="logoInput" accept="image/*">
      </label>

      <div>
        <button type="submit">Generer DOCX</button>
      </div>

      <div id="status"></div>
    </form>

    <hr>
    <p>Prøv først med et test-JSON som inneholder feltene du ønsker. Hvis du har et stort JSON (f.eks. 725KB) kan du laste det opp direkte her.</p>
  </main>

<script>
const form = document.getElementById('uploadForm');
const status = document.getElementById('status');

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  status.textContent = 'Genererer…';

  const jsonInput = document.getElementById('jsonInput');
  if (!jsonInput.files.length) { status.textContent = 'Velg en JSON-fil først.'; return; }

  const formData = new FormData();
  formData.append('json', jsonInput.files[0]);
  const logoInput = document.getElementById('logoInput');
  if (logoInput.files.length) formData.append('logo', logoInput.files[0]);

  try {
    const resp = await fetch('/generate', { method: 'POST', body: formData });
    if (!resp.ok) {
      const text = await resp.text();
      status.textContent = 'Feil: ' + text;
      return;
    }
    const blob = await resp.blob();
    const a = document.createElement('a');
    const url = window.URL.createObjectURL(blob);
    a.href = url;
    const disposition = resp.headers.get('Content-Disposition') || '';
    let filename = 'helseopplysninger.docx';
    const match = /filename="?([^";]+)"?/.exec(disposition);
    if (match) filename = match[1];
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    status.textContent = 'Ferdig — fil lastes ned.';
  } catch (err) {
    console.error(err);
    status.textContent = 'Serverfeil eller nettverksfeil.';
  }
});
</script>
</body>
</html>
